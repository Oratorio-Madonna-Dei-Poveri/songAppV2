<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MdP SongApp — DJ</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=11">
</head>
<body data-page="dj">
  <div class="app-container">
    <header class="app-header">
      <div>
        <h1>🎧 MdP SongApp</h1>
        <p class="app-subtitle">Pannello DJ</p>
      </div>
      <div class="header-right">
        <span class="header-role-badge">🎧 DJ Console</span>
        <div id="connection-status" class="connection-badge connecting">
          <span class="dot"></span>
          <span class="status-text">Connessione...</span>
        </div>
      </div>
    </header>

    <section class="playlist-section">
      <div class="playlist-header">
        <h2 class="section-title">Playlist</h2>
        <span id="playlist-count" class="playlist-count">0</span>
      </div>
      <div id="playlist-list" class="playlist-list">
        <!-- Rendered by JS -->
      </div>
    </section>

    <!-- Footer (il link "Crediti" viene aggiunto automaticamente da js/realtime.js) -->
    <footer class="app-footer">
      <div class="footer-content">
        <span>© 2026 Oratorio Madonna dei Poveri. Tutti i diritti riservati.</span>
      </div>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <script src="js/config.js?v=11"></script>
  <script src="js/supabase-init.js?v=11"></script>
  <script src="js/realtime.js?v=11"></script>
  <script src="js/dj.js?v=11"></script>
</body>
</html>
